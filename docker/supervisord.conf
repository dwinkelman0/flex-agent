[supervisord]
nodaemon=true
user=dev
logfile=/var/log/flex-agent/supervisord.log
pidfile=/tmp/supervisord.pid
directory=/opt/flex-agent

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:serve]
; NB: supervisord performs %(name)s expansion on command= strings, so bare
; % characters are FORBIDDEN here (only intentional %(ENV_*)s on the
; environment= lines). Use echo|tr, never printf "%s", for case folding.
command=/bin/sh -c 'LVL=${OPENCODE_LOG_LEVEL:-info}; LVL=$(echo "$LVL" | tr "[:upper:]" "[:lower:]"); cd /opt/flex-agent/agent && exec opencode serve --port "${OPENCODE_PORT}" --hostname "${OPENCODE_HOSTNAME}" --print-logs --log-level "$LVL" 2>&1 | exec python3 /opt/docker/logprefix.py serve'
directory=/opt/flex-agent/agent
environment=PEER_USERNAME="%(ENV_ROCKETCHAT_PEER_USERNAME)s",OPENCODE_PORT="%(ENV_OPENCODE_PORT)s",ROCKETCHAT_DEBUG="%(ENV_ROCKETCHAT_DEBUG)s"
autorestart=true
stopasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/flex-agent/serve.log
stderr_logfile=/var/log/flex-agent/serve.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:gateway]
command=/bin/sh -c 'HOOK="--webhook-port 0"; uv run --project /opt/flex-agent/chat /opt/flex-agent/chat/gateway.py --help 2>/dev/null | grep -q "webhook-bind" && HOOK="--webhook-bind "${GITEA_WEBHOOK_BIND}" --webhook-port "${GITEA_WEBHOOK_PORT}""; echo "[gateway] hook mode: $HOOK" >&2; exec uv run --project /opt/flex-agent/chat /opt/flex-agent/chat/gateway.py "${ROCKETCHAT_PEER_USERNAME}" --opencode-url "http://127.0.0.1:${OPENCODE_PORT}" --issue dwinkelman/demo#1 $HOOK --ephemeral --log-level DEBUG 2>&1 | exec python3 /opt/docker/logprefix.py gateway'
; Demo wiring: statically subscribed to the dwinkelman/demo#1 issue —
; comments there dispatch as gitea: prompts alongside DMs. Final form
; will be dynamic (subscription API); this hardcoding is demo-only.
; HOOK probe: clones predating --webhook-bind fall back to --webhook-port 0
; (poll-only). Committing/pushing the flag unlocks push mode automatically.
directory=/opt/flex-agent
autorestart=true
stopasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/flex-agent/gateway.log
stderr_logfile=/var/log/flex-agent/gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:console]
command=tail -qF /var/log/flex-agent/serve.log /var/log/flex-agent/gateway.log
autorestart=true
startsecs=0
stdout_logfile=NONE
stderr_logfile=NONE
